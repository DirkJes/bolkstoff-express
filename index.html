<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bölkstoff-Express — ein Boulder-Dash-Remake</title>
  <style>
    :root {
      --hintergrund: #0d0d1a;
      --holz: #9a6a42;
      --holz-dunkel: #5f3f26;
      --gold: #e8b53a;
      --text: #d8d8ec;
      --text-dunkel: #8a8aa8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -20%, #1c1c3a 0%, var(--hintergrund) 60%);
      color: var(--text);
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 34px;
      letter-spacing: 6px;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(232, 181, 58, 0.35), 2px 2px 0 #000;
    }
    .unterzeile {
      margin: 0 0 14px;
      color: var(--text-dunkel);
      font-size: 13px;
      letter-spacing: 1px;
    }
    #buehne { position: relative; }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 4px solid var(--holz);
      outline: 2px solid var(--holz-dunkel);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      background: #141428;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(8, 8, 20, 0.82);
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }
    #overlay.versteckt { display: none; }
    #overlay-titel {
      font-size: 30px;
      letter-spacing: 4px;
      color: var(--gold);
      text-shadow: 2px 2px 0 #000;
      margin: 0;
    }
    #overlay-text {
      max-width: 460px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      margin: 0;
    }
    #overlay-hinweis {
      font-size: 12px;
      color: var(--text-dunkel);
      margin-top: 6px;
      animation: blinken 1.4s ease-in-out infinite;
    }
    @keyframes blinken { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    #hud {
      display: flex;
      gap: 18px;
      width: 100%;
      border: 4px solid var(--holz);
      border-top: none;
      background: #10101f;
      padding: 6px 12px;
      font-size: 13px;
      letter-spacing: 1px;
    }
    #hud span { color: var(--text); }
    #hud .wert { color: var(--gold); }
    #level-wahl {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 12px;
      width: 100%;
      max-width: 712px;
    }
    #level-wahl button {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 7px 4px;
      background: #1a1a30;
      color: var(--text);
      border: 2px solid #2c2c4a;
      cursor: pointer;
    }
    #level-wahl button:hover { border-color: var(--gold); color: var(--gold); }
    #level-wahl button.aktiv { border-color: var(--gold); background: #2a2440; color: var(--gold); }
    #level-wahl button.fertig::after { content: ' ✓'; color: #6fbf73; }
    #level-wahl button.fertig.aktiv::after { color: #9fd8a4; }
    .steuerung {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-dunkel);
      letter-spacing: 0.5px;
    }
    .steuerung b { color: var(--text); }
  </style>
</head>
<body>
  <h1>BÖLKSTOFF-EXPRESS</h1>
  <p class="unterzeile">Ein Boulder-Dash-Remake nach dem Public-Domain-Klassiker „Werner Flaschbier“</p>

  <div id="buehne">
    <canvas id="spiel" width="704" height="448"></canvas>
    <div id="overlay">
      <p id="overlay-titel">…</p>
      <p id="overlay-text"></p>
      <p id="overlay-hinweis"></p>
    </div>
  </div>

  <div id="hud">
    <span id="hud-level">Bölkstoff-Express</span>
    <span>Flaschen <span class="wert" id="hud-flaschen">0/0</span></span>
    <span>Tode <span class="wert" id="hud-tode">0</span></span>
    <span id="hud-ton">Ton: an (M)</span>
  </div>

  <div id="level-wahl"></div>

  <p class="steuerung">
    <b>Pfeiltasten / WASD</b> steuern · <b>M</b> Ton · <b>P</b> Pause · <b>R</b> Level neu
  </p>

  <script src="src/levels.js"></script>
  <script src="src/logik.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/geraeusche.js"></script>
  <script src="src/haupt.js"></script>
</body>
</html>
